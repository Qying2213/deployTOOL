# Old static website is retired; keep a verified TLS forwarder for DNS cache drain.
server {
    listen 80;
    server_name yinlizhangyu.com www.yinlizhangyu.com;
    location ^~ /.well-known/acme-challenge/ {
        proxy_pass http://@NEW_IPV4@;
        proxy_set_header Host yinlizhangyu.com;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
    }
    location / { return 301 https://yinlizhangyu.com$request_uri; }
}
server {
    listen 443 ssl http2;
    server_name yinlizhangyu.com www.yinlizhangyu.com;
    ssl_certificate /etc/letsencrypt/live/yinlizhangyu.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yinlizhangyu.com/privkey.pem;
    access_log off;
    location / {
        proxy_pass https://@NEW_IPV4@;
        proxy_ssl_server_name on;
        proxy_ssl_name yinlizhangyu.com;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_set_header Host yinlizhangyu.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_connect_timeout 3s;
        proxy_read_timeout 60s;
    }
}
