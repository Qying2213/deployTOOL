# Dedicated public website namespace. Never log query strings or media tickets.
log_format public_website_timing '$time_iso8601 $remote_addr "$request_method $uri" '
    '$status $body_bytes_sent rt=$request_time upstream=$upstream_response_time '
    'request_id=$website_request_id';
map $upstream_http_x_request_id $website_request_id {
    default $upstream_http_x_request_id;
    "" $request_id;
}
limit_req_zone $binary_remote_addr zone=public_website_queries:10m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=public_website_clients:10m;
limit_conn_zone $server_name zone=public_website_total:1m;
