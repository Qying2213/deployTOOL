server {
    listen 80;
    server_name yinlizhangyu.com www.yinlizhangyu.com;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/loumai-public-website-acme;
        try_files $uri =404;
    }
    location / { return 301 https://yinlizhangyu.com$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name yinlizhangyu.com www.yinlizhangyu.com;
    ssl_certificate /etc/loumai-public-website/tls/fullchain.pem;
    ssl_certificate_key /etc/loumai-public-website/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /srv/loumai-public-website/current/site;
    index index.html;
    server_tokens off;
    access_log /var/log/nginx/public-website-access.log public_website_timing;
    # Nginx request errors include the unredacted request line (query/tickets).
    # Use URI-only access logs and sanitized standalone application errors instead.
    error_log /dev/null;
    set_real_ip_from @OLD_IPV4@;
    real_ip_header X-Real-IP;
    real_ip_recursive off;

    include /etc/nginx/snippets/public-website-headers.conf;

    if ($request_method !~ ^(GET|HEAD)$) { return 405; }
    error_page 429 = @website_rate_limited;
    error_page 405 = @website_read_only;
    limit_req_status 429;
    limit_conn_status 429;
    limit_conn public_website_clients 24;
    limit_conn public_website_total 96;

    location @website_rate_limited {
        include /etc/nginx/snippets/public-website-headers.conf;
        default_type application/json;
        add_header Cache-Control no-store always;
        add_header Retry-After 1 always;
        return 429 '{"code":"RATE_LIMITED","message":"请求过于频繁，请稍后重试","data":{},"request_id":"$request_id"}';
    }
    location @website_read_only {
        include /etc/nginx/snippets/public-website-headers.conf;
        default_type application/json;
        add_header Allow "GET, HEAD" always;
        return 405 '{"code":"METHOD_NOT_ALLOWED","message":"官网仅支持查询","data":{},"request_id":"$request_id"}';
    }
    location = /_site_health {
        include /etc/nginx/snippets/public-website-headers.conf;
        proxy_pass http://127.0.0.1:8011/health;
        proxy_set_header Host yinlizhangyu.com;
        add_header Cache-Control no-store always;
    }
    location ~ ^/api/v1/public-website/(properties|landlords)/[0-9a-f-]+/media/[0-9a-f-]+$ {
        proxy_pass http://127.0.0.1:8011;
        include /etc/nginx/snippets/public-website-proxy.conf;
        proxy_buffering off;
        proxy_read_timeout 60s;
        limit_rate 2m;
    }
    location /api/v1/public-website/ {
        limit_req zone=public_website_queries burst=20 nodelay;
        proxy_pass http://127.0.0.1:8011;
        include /etc/nginx/snippets/public-website-proxy.conf;
        proxy_read_timeout 12s;
    }
    location /api/ { return 404; }
    location ~ /\. { return 404; }
    location ~* \.(env|pem|key|p12|pfx|sql|sqlite|db|bak|log)$ { return 404; }
    location /assets/ {
        try_files $uri =404;
        expires 1y;
    }
    location = /index.html {
        include /etc/nginx/snippets/public-website-headers.conf;
        add_header Cache-Control no-store always;
    }
    location / {
        include /etc/nginx/snippets/public-website-headers.conf;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control no-store always;
    }
}
